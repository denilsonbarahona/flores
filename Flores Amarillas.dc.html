<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0f0c08;overflow:hidden}
a{color:#FFD23F}a:hover{color:#FFE88A}
@keyframes grow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes bloom{0%{transform:rotate(-28deg) scale(.15,0);opacity:0}65%{transform:rotate(2deg) scale(1.04,1.06);opacity:1}100%{transform:rotate(0) scale(1,1);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.025) rotate(1.5deg)}}
@keyframes glowIn{from{opacity:0}to{opacity:1}}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(40px,-340px);opacity:0}}
@keyframes heart{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot));opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dc-paused svg *,.dc-paused .dc-pollen span{animation-play-state:paused!important}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(120% 80% at 50% 110%, #3a2a12 0%, #1a140c 45%, #0f0c08 100%);font-family:'Jost',sans-serif;color:#F6EBD2;user-select:none">
  {{ scene }}
  {{ pollen }}
  <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:28px 32px;pointer-events:none;z-index:5">
    <div style="display:flex;flex-direction:column;gap:6px;animation:fadeIn 2s ease .6s both">
      <p style="margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(28px,4vw,44px);line-height:1;color:#FFE7A3">Para ti, {{ nombre }}</p>
      <p style="margin:0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#BFA982">{{ counter }}</p>
    </div>
    <button onClick="{{ replay }}" style="pointer-events:auto;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#FFE7A3;background:transparent;border:1px solid rgba(255,214,110,.35);border-radius:999px;padding:10px 18px;cursor:pointer;transition:background .3s" style-hover="background:rgba(255,214,110,.12)">Florecer de nuevo</button>
  </div>
  <sc-if value="{{ bloomed }}" hint-placeholder-val="{{ false }}">
    <p style="position:absolute;left:0;right:0;bottom:28px;margin:0;padding:0 24px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2.4vw,24px);color:#E9D6A8;pointer-events:none;animation:fadeIn 1.6s ease both;z-index:5;text-wrap:balance">Toca cada pétalo. Cada uno guarda algo que quiero que sepas.</p>
  </sc-if>
  {{ bursts }}
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:32px;background:rgba(12,9,5,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .5s ease both;cursor:pointer">
      <div style="max-width:760px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;animation:rise 1s cubic-bezier(.2,.8,.2,1) .1s both">
        <p style="margin:0;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#C9AE72">{{ msgLabel }}</p>
        <div style="width:10px;height:10px;background:#FFD23F;transform:rotate(45deg);box-shadow:0 0 24px 6px rgba(255,210,63,.45)"></div>
        <p style="margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(32px,5.4vw,60px);line-height:1.15;color:#FFF4D6;text-wrap:balance">{{ msg }}</p>
        <button onClick="{{ close }}" style="margin-top:8px;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1a140c;background:#FFD23F;border:none;border-radius:999px;padding:14px 26px;cursor:pointer;transition:background .3s" style-hover="background:#FFE27A">Seguir descubriendo</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;nombre&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;mi amor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flores&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:3,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;velocidad&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;}}">
const MENSAJES = [
  "Eres lo más bonito que me ha pasado en la vida.",
  "Te amo más de lo que las palabras pueden explicar.",
  "Puedes con todo. Lo he visto una y otra vez.",
  "Vales muchísimo, incluso en los días en que no lo sientes.",
  "Tu sonrisa hace que cualquier día gris se vuelva amarillo.",
  "Eres más fuerte de lo que crees y más capaz de lo que imaginas.",
  "Contigo aprendí que el amor también es calma.",
  "El mundo es mejor porque tú estás en él.",
  "Qué orgullo me da ver todo lo que logras.",
  "Si pudieras verte con mis ojos, sabrías lo increíble que eres.",
  "Eres mi lugar favorito.",
  "Todo lo que sueñas está a tu alcance.",
  "Tu forma de ver el mundo me inspira todos los días.",
  "Eres suficiente, tal como eres.",
  "Contigo hasta lo más simple se vuelve especial.",
  "No hay nada que no puedas lograr cuando te lo propones.",
  "Gracias por existir y por elegirme.",
  "Tu corazón es de las cosas más bonitas que conozco.",
  "Mereces todo lo bueno que te pase, y mucho más.",
  "Te elegiría una y mil veces.",
  "Brillas incluso cuando no te das cuenta.",
  "Tu risa es mi canción favorita.",
  "Cada día a tu lado es un regalo.",
  "Eres valiente, aunque a veces tengas miedo. Eso es ser valiente.",
  "Nunca olvides lo mucho que vales.",
  "Eres genial. Simplemente genial.",
  "Mi amor por ti florece un poco más cada día.",
  "Confío en ti más que en nadie.",
  "Haces que la vida se sienta más ligera.",
  "Todo lo que tocas, lo haces mejor.",
  "Eres mi persona favorita en todo el universo.",
  "Ningún sueño es demasiado grande para ti.",
  "Te admiro profundamente.",
  "Tienes una luz que nada puede apagar.",
  "Contigo quiero todos los mañanas.",
  "Tus sueños importan, y tú también.",
  "Eres la razón de muchas de mis sonrisas.",
  "Pase lo que pase, aquí estoy para ti.",
  "Eres un milagro que llegó a mi vida.",
  "Te amo hoy, mañana y siempre."
];

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const LAYERS = [
  { n: 20, L: 1, w: 0.2, g: 'A' },
  { n: 16, L: 0.8, w: 0.2, g: 'B' },
  { n: 12, L: 0.58, w: 0.19, g: 'C' }
];

function petalPath(L, w) {
  return `M0,0 C${w},${-L * 0.3} ${w * 0.85},${-L * 0.85} 0,${-L} C${-w * 0.85},${-L * 0.85} ${-w},${-L * 0.3} 0,0Z`;
}

class Component extends DCLogic {
  state = { run: 0, read: {}, count: 0, open: false, msg: '', msgNum: 0, bursts: [], bloomed: false, aspect: 1.6 };

  componentDidMount() {
    const applyAspect = () => this.setState({ aspect: window.innerWidth / Math.max(1, window.innerHeight) });
    this.onResize = () => { clearTimeout(this.rt); this.rt = setTimeout(applyAspect, 150); };
    applyAspect();
    window.addEventListener('resize', this.onResize);
    this.schedule();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    clearTimeout(this.bt); clearTimeout(this.ot); clearTimeout(this.rt);
    document.body.classList.remove('dc-paused');
  }
  componentDidUpdate(pp) {
    if (pp.flores !== this.props.flores || pp.velocidad !== this.props.velocidad) this.schedule();
  }
  schedule() {
    clearTimeout(this.bt);
    this.setState({ bloomed: false });
    const lay = this.layout();
    this.bt = setTimeout(() => this.setState({ bloomed: true }), lay.total * 1000);
  }

  layout() {
    const n = Math.max(1, Math.min(14, this.props.flores ?? 7));
    const sp = Math.max(0.2, this.props.velocidad ?? 1);
    const key = `${n}|${this.state.aspect.toFixed(2)}|${sp}`;
    if (this._lk === key) return this._lay;
    const H = 1000, W = Math.max(700, Math.min(2400, H * this.state.aspect));
    const sc = Math.max(0.62, Math.min(1.1, W / 1500));
    const r = rng(11 + n);
    const order = Array.from({ length: n }, (_, i) => i).sort(() => r() - 0.5);
    const flowers = [];
    let total = 0;
    for (let i = 0; i < n; i++) {
      const fx = W * (0.08 + 0.84 * (i + 0.5) / n) + (r() - 0.5) * W * 0.5 / n;
      const cy = H * (0.3 + r() * 0.34);
      const R = (80 + r() * 58) * sc;
      const x0 = fx + (r() - 0.5) * 140 * sc, y0 = H + 10;
      const cx = (x0 + fx) / 2 + (r() - 0.5) * 180 * sc, cyc = (y0 + cy) / 2;
      const delay = (0.3 + order[i] * 0.45) / sp;
      const stemDur = 2 / sp;
      const head = delay + stemDur * 0.85;
      const leaves = [0.42, 0.68].map((t, k) => {
        const px = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * cx + t * t * fx;
        const py = (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cyc + t * t * cy;
        const dx = 2 * (1 - t) * (cx - x0) + 2 * t * (fx - cx);
        const dy = 2 * (1 - t) * (cyc - y0) + 2 * t * (cy - cyc);
        const tan = Math.atan2(dy, dx) * 180 / Math.PI;
        const side = (k + i) % 2 ? 1 : -1;
        return { px, py, ang: tan + side * 62, L: R * (0.85 + r() * 0.3), d: delay + stemDur * t };
      });
      const rot0 = r() * 360;
      total = Math.max(total, head + (0.5 + 12 * 0.035 + 1.5) / sp);
      flowers.push({ id: i, fx, cy, R, stem: `M${x0},${y0} Q${cx},${cyc} ${fx},${cy}`, delay, stemDur, head, leaves, rot0, sw: Math.max(4, R * 0.075) });
    }
    flowers.sort((a, b) => a.cy - b.cy);
    this._lk = key;
    this._lay = { W, H, flowers, total, sp };
    return this._lay;
  }

  hoverOn = (e) => { e.currentTarget.style.transform = 'scale(1.13)'; e.currentTarget.style.filter = 'brightness(1.18)'; };
  hoverOff = (e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.filter = ''; };

  clickPetal(pid, e) {
    if (this.state.open) return;
    const group = e.currentTarget, layer = group.dataset.g, path = group.firstChild;
    if (path && layer) path.setAttribute('fill', `url(#gR${layer})`);
    const x = e.clientX, y = e.clientY;
    const bid = Date.now() + Math.random();
    const num = this.state.count % MENSAJES.length;
    this.setState(s => ({
      read: { ...s.read, [pid]: true },
      count: s.count + 1,
      bursts: [...s.bursts, { id: bid, x, y }]
    }));
    setTimeout(() => this.setState(s => ({ bursts: s.bursts.filter(b => b.id !== bid) })), 1600);
    clearTimeout(this.ot);
    this.ot = setTimeout(() => {
      document.body.classList.add('dc-paused');
      this.setState({ open: true, msg: MENSAJES[num], msgNum: num + 1 });
    }, 550);
  }

  buildScene() {
    const h = React.createElement;
    const { W, H, flowers, sp } = this.layout();
    const sceneKey = `${this.state.run}|${this._lk}`;
    if (this._sceneKey === sceneKey) return this._scene;
    const read = this.state.read;
    const grad = (id, a, b) => h('linearGradient', { key: id, id, x1: 0, y1: 1, x2: 0, y2: 0 },
      h('stop', { offset: '0%', stopColor: a }), h('stop', { offset: '100%', stopColor: b }));
    const defs = h('defs', null,
      grad('gA', '#D97800', '#FFD23F'), grad('gB', '#EE9A00', '#FFE066'), grad('gC', '#F5B000', '#FFEC8A'),
      grad('gRA', '#FFB627', '#FFF3B8'), grad('gRB', '#FFC640', '#FFF6C8'), grad('gRC', '#FFD45A', '#FFFADB'),
      grad('gLeaf', '#2E5520', '#6E9A3E'),
      h('radialGradient', { key: 'disc', id: 'gDisc' }, h('stop', { offset: '0%', stopColor: '#A8621A' }), h('stop', { offset: '100%', stopColor: '#4E2A08' })),
      h('radialGradient', { key: 'halo', id: 'gHalo' }, h('stop', { offset: '0%', stopColor: 'rgba(255,205,70,.34)' }), h('stop', { offset: '100%', stopColor: 'rgba(255,205,70,0)' }))
    );
    const els = flowers.map(f => {
      const stem = h('path', { key: 's', d: f.stem, fill: 'none', stroke: '#4B7A2E', strokeWidth: f.sw, strokeLinecap: 'round', pathLength: 1,
        style: { strokeDasharray: 1, strokeDashoffset: 1, animation: `grow ${f.stemDur}s cubic-bezier(.45,.1,.3,1) ${f.delay}s forwards` } });
      const leaves = f.leaves.map((l, k) => h('g', { key: 'l' + k, transform: `translate(${l.px},${l.py}) rotate(${l.ang})` },
        h('path', { d: `M0,0 C${l.L * .25},${-l.L * .3} ${l.L * .7},${-l.L * .32} ${l.L},0 C${l.L * .7},${l.L * .18} ${l.L * .25},${l.L * .2} 0,0Z`, fill: 'url(#gLeaf)',
          style: { transformOrigin: '0 0', animation: `pop ${1.2 / sp}s ease-out ${l.d}s both` } })));
      const petals = [];
      LAYERS.forEach((ly, li) => {
        const L = f.R * ly.L, w = f.R * ly.w, d = petalPath(L, w);
        for (let j = 0; j < ly.n; j++) {
          const pid = `${f.id}-${li}-${j}`;
          const ang = f.rot0 + (360 / ly.n) * (j + li * 0.5);
          const pd = f.head + (li * 0.25 + j * 0.035) / sp;
          petals.push(h('g', { key: pid, transform: `rotate(${ang})` },
            h('g', { style: { transformOrigin: '0 0', animation: `bloom ${1.5 / sp}s cubic-bezier(.2,.8,.2,1) ${pd}s both` } },
              h('g', { style: { transformOrigin: '0 0', transition: 'transform .35s ease, filter .35s ease', cursor: 'pointer' },
                'data-g': ly.g,
                onMouseEnter: this.hoverOn, onMouseLeave: this.hoverOff, onClick: (e) => this.clickPetal(pid, e) },
                h('path', { d, fill: `url(#g${read[pid] ? 'R' : ''}${ly.g})`, stroke: 'rgba(130,70,0,.28)', strokeWidth: 0.7, style: { transition: 'fill .6s' } }),
                h('path', { d: `M0,${-L * 0.12} L0,${-L * 0.82}`, stroke: 'rgba(190,110,0,.35)', strokeWidth: 0.8, fill: 'none', pointerEvents: 'none' })))));
        }
      });
      const D = f.R * 0.3, N = 64, c = D * 0.9 / Math.sqrt(N), sr = D * 0.065;
      const seeds = [];
      for (let b = 0; b < 8; b++) {
        let dark = '', light = '';
        for (let k = Math.max(1, b * 8); k < (b + 1) * 8; k++) {
          const rr = c * Math.sqrt(k), th = k * 2.39996, x = rr * Math.cos(th), y = rr * Math.sin(th);
          const dot = `M${x - sr},${y}a${sr},${sr} 0 1,0 ${sr * 2},0a${sr},${sr} 0 1,0 ${-sr * 2},0`;
          if (k % 3) dark += dot; else light += dot;
        }
        seeds.push(h('g', { key: b, style: { transformOrigin: '0 0', animation: `pop ${0.6 / sp}s ease-out ${f.head + (0.3 + b * 8 * 0.012) / sp}s both` } },
          h('path', { d: dark, fill: '#3A1F05' }), h('path', { d: light, fill: '#6B3B0C' })));
      }
      const head = h('g', { key: 'h', transform: `translate(${f.fx},${f.cy})` },
        h('circle', { r: f.R * 1.9, fill: 'url(#gHalo)', pointerEvents: 'none', style: { animation: `glowIn ${2.5 / sp}s ease ${f.head + 0.6 / sp}s both` } }),
        h('g', { style: { transformOrigin: '0 0', animation: `breathe 6s ease-in-out ${f.head + 3 / sp}s infinite` } },
          ...petals,
          h('circle', { key: 'disc', r: D, fill: 'url(#gDisc)', style: { transformOrigin: '0 0', animation: `pop ${0.8 / sp}s ease-out ${f.head}s both` } }),
          h('g', { key: 'seeds', pointerEvents: 'none' }, ...seeds)));
      return h('g', { key: 'f' + f.id }, stem, ...leaves, head);
    });
    const scene = h('svg', { key: 'run' + this.state.run, viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMax meet',
      style: { position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' } }, defs, ...els);
    this._sceneKey = sceneKey;
    this._scene = scene;
    return scene;
  }

  buildPollen() {
    if (this._pollen) return this._pollen;
    const h = React.createElement, r = rng(5);
    const dots = Array.from({ length: 30 }, (_, i) => {
      const s = 2 + r() * 3, dur = 9 + r() * 9;
      return h('span', { key: i, style: { position: 'absolute', left: `${r() * 100}%`, top: `${40 + r() * 65}%`, width: s, height: s, borderRadius: '50%',
        background: '#FFE38A', boxShadow: '0 0 8px 2px rgba(255,220,120,.55)', animation: `drift ${dur}s linear ${-r() * dur}s infinite` } });
    });
    this._pollen = h('div', { className: 'dc-pollen', style: { position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' } }, ...dots);
    return this._pollen;
  }

  buildBursts() {
    const h = React.createElement;
    return h('div', { style: { position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 15 } },
      ...this.state.bursts.map(b => h('div', { key: b.id }, ...Array.from({ length: 14 }, (_, i) => {
        const a = (i / 14) * Math.PI * 2 + Math.random() * 0.4, dist = 50 + Math.random() * 70;
        return h('span', { key: i, style: { position: 'absolute', left: b.x, top: b.y, fontSize: 12 + Math.random() * 14, lineHeight: 1,
          color: i % 3 ? '#FFD23F' : '#FF8A7A', textShadow: '0 0 10px rgba(255,200,80,.6)',
          '--dx': `${Math.cos(a) * dist}px`, '--dy': `${Math.sin(a) * dist - 30}px`, '--rot': `${(Math.random() - 0.5) * 90}deg`,
          animation: `heart ${1 + Math.random() * 0.5}s cubic-bezier(.2,.7,.3,1) both` } }, '♥');
      }))));
  }

  renderVals() {
    const count = this.state.count, total = MENSAJES.length;
    const seen = Math.min(count, total);
    return {
      scene: this.buildScene(),
      pollen: this.buildPollen(),
      bursts: this.buildBursts(),
      nombre: this.props.nombre ?? 'mi amor',
      counter: seen === 0 ? `${total} mensajes escondidos` : `${seen} de ${total} mensajes descubiertos`,
      bloomed: this.state.bloomed && !this.state.open,
      open: this.state.open,
      msg: this.state.msg,
      msgLabel: `Mensaje ${this.state.msgNum} de ${total}`,
      close: (e) => { e && e.stopPropagation(); document.body.classList.remove('dc-paused'); this.setState({ open: false }); },
      replay: () => { document.body.classList.remove('dc-paused'); this.setState(s => ({ run: s.run + 1, read: {}, count: 0, open: false })); this.schedule(); }
    };
  }
}
</script>
</body>
</html>
